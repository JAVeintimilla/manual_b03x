<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D2733">
  <meta name="description" content="Manual de casa del Leapmotor B03X en castellano: carga, testigos, configuración, conducción y emergencias.">
  <title>Leapmotor B03X · Manual de casa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.47.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/light.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css">
  <style>body.is-booting { visibility: hidden; }</style>
  <script>
    // Leo la versión sin caché y cargo estilos y lógica con ?v=versión: así cada publicación obliga a descargarlos de nuevo
    (async () => {
      let version = String(Date.now());
      try {
        const response = await fetch("version.json", { cache: "no-store" });
        version = (await response.json()).version;
      } catch (error) {
        console.warn("No he podido leer version.json; cargo sin caché", error);
      }
      window.APP_VERSION = version;
      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = `css/styles.css?v=${encodeURIComponent(version)}`;
      stylesheet.onload = stylesheet.onerror = () => document.body.classList.remove("is-booting");
      document.head.append(stylesheet);
      const appScript = document.createElement("script");
      appScript.type = "module";
      appScript.src = `js/app.js?v=${encodeURIComponent(version)}`;
      const appendApp = () => { if (!appScript.isConnected) document.body.append(appScript); };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", appendApp, { once: true });
      else appendApp();
    })();
  </script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"></script>
</head>
<body class="is-booting">
  <a class="skip-link" href="#content">Saltar al contenido</a>

  <div class="app">
    <aside class="sidebar" aria-label="Índice del manual">
      <div class="sidebar__brand">
        <a href="#/" class="brand" data-nav>
          <span class="brand__mark"><i class="ti ti-steering-wheel"></i></span>
          <span class="brand__text"><strong>B03X</strong><span>Manual de casa</span></span>
        </a>
      </div>
      <nav class="tree" id="tree-desktop"></nav>
      <div class="sidebar__footer">
        <a class="pdf-link" href="docs/B03X_guia_completa_castellano.pdf" target="_blank" rel="noopener">
          <i class="ti ti-file-type-pdf"></i> Abrir el PDF completo
        </a>
        <p class="app-version">Versión <span data-app-version></span></p>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-open" aria-label="Abrir el índice"><i class="ti ti-menu-2"></i></button>
        <nav class="crumbs" id="crumbs" aria-label="Estás aquí"></nav>
        <button class="search-trigger" id="search-open" aria-label="Buscar en el manual">
          <i class="ti ti-search"></i><span>Buscar</span><kbd>/</kbd>
        </button>
        <sl-tooltip content="Cambiar tema claro u oscuro">
          <button class="icon-btn" id="theme-toggle" aria-label="Cambiar tema"><i class="ti ti-moon"></i></button>
        </sl-tooltip>
      </header>

      <main id="content" class="content" tabindex="-1"></main>
    </div>
  </div>

  <sl-drawer id="drawer" placement="start" label="Índice" class="drawer">
    <nav class="tree tree--drawer" id="tree-mobile"></nav>
    <div slot="footer">
      <a class="pdf-link" href="docs/B03X_guia_completa_castellano.pdf" target="_blank" rel="noopener">
        <i class="ti ti-file-type-pdf"></i> Abrir el PDF completo
      </a>
      <p class="app-version">Versión <span data-app-version></span></p>
    </div>
  </sl-drawer>

  <div class="search" id="search" hidden>
    <div class="search__backdrop" data-close></div>
    <div class="search__panel" role="dialog" aria-modal="true" aria-label="Buscar en el manual">
      <div class="search__field">
        <i class="ti ti-search"></i>
        <input id="search-input" type="search" placeholder="Qué necesitas: pinchazo, testigo, cargar, presión…" autocomplete="off" enterkeyhint="go">
        <button class="icon-btn" data-close aria-label="Cerrar la búsqueda"><i class="ti ti-x"></i></button>
      </div>
      <ol class="search__results" id="search-results"></ol>
      <p class="search__hint"><kbd>↑</kbd><kbd>↓</kbd> para moverte, <kbd>Intro</kbd> para abrir, <kbd>Esc</kbd> para cerrar</p>
    </div>
  </div>

  <button class="to-top" id="to-top" aria-label="Volver arriba"><i class="ti ti-arrow-up"></i></button>

</body>
</html>
